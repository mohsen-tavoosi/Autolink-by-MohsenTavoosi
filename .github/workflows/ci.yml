name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
      - name: Lint
        run: find autolink-by-mohsentavoosi -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Engine tests
        run: php tests/run-vectors.php && php tests/hooks-unit.php && php tests/admin-smoke.php && php tests/migration-unit.php
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr, phpcs
      - run: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      - run: composer global require --dev wp-coding-standards/wpcs:^3.0 dealerdirect/phpcodesniffer-composer-installer
      - run: phpcs --standard=phpcs.xml.dist -q --report=checkstyle | cs2pr
